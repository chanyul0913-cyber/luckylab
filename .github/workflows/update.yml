name: 로또 데이터 갱신 및 배포

on:
  schedule:
    # 추첨은 토요일 20:35 KST. GitHub 예약 실행은 늦어지거나 빠질 수 있어 여러 번 시도 (이미 반영됐으면 아무것도 안 함)
    - cron: "50 12 * * 6"   # 토 21:50 KST
    - cron: "30 14 * * 6"   # 토 23:30 KST
    - cron: "0 1 * * 0"     # 일 10:00 KST
    - cron: "0 1 * * 1"     # 월 10:00 KST
    - cron: "0 0 * * *"     # 매일 09:00 KST (포브스 실시간 부자 순위)
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_dl:
        description: "딥러닝을 새 회차가 없어도 다시 학습"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 동행복권에서 최신 회차 받기
        run: python fetch_lotto.py
      - name: 포브스 실시간 부자 순위 받기 (실패하면 기존 순위 유지)
        run: python fetch_rich.py
      - name: 딥러닝(LSTM) 학습 (새 회차가 있을 때만)
        run: |
          if [ "${{ inputs.force_dl }}" != "true" ] && python -c "import csv,json;n=sum(1 for r in csv.reader(open('lotto645.csv',encoding='utf-8-sig')) if r and r[0].isdigit());d=json.loads(open('dl.js',encoding='utf-8').read().split('=',1)[1].rstrip().rstrip(';'));raise SystemExit(0 if d['last']==n else 1)"; then
            echo "dl.js가 이미 최신 회차라 학습 생략"
          else
            pip install --quiet numpy torch --index-url https://download.pytorch.org/whl/cpu
            python dl_train.py --force
          fi
      - name: 새 회차가 있으면 저장소에 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lotto645.csv data.js dl.js rich.js
          git diff --cached --quiet || { git commit -m "data: 자동 갱신 (로또 회차·포브스 순위)"; git push; }
      - name: 사이트 파일 모으기
        run: |
          mkdir _site && cp index.html data.js dl.js rich.js sw.js manifest.webmanifest icon-192.png icon-512.png sitemap.xml _site/
          # 브라우저가 예전 데이터 파일을 캐시해 새 페이지와 섞이지 않도록, 배포마다 주소에 버전을 붙임
          sed -i -E 's/src="(data|dl|rich)\.js"/src="\1.js?v=${{ github.run_id }}"/g' _site/index.html
          grep -o 'src="[a-z]*\.js?v=[0-9]*"' _site/index.html
          # 새 버전 알림: 화면(index.html)·당첨번호(data.js)·딥러닝(dl.js)이 바뀔 때만 번호가 바뀜
          # (포브스 순위는 거의 매일 바뀌어 run_id를 쓰면 열어 둔 화면에 매일 띠가 떴음 — 순위는 띠 없이 다음 접속 때 반영)
          V=$(cat index.html data.js dl.js | sha256sum | cut -c1-12)
          sed -i "s/__APP_VER__/$V/" _site/index.html
          echo "{\"v\":\"$V\"}" > _site/version.json
          grep -c "APP_VER = \"$V\"" _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
